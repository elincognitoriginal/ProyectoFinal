<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Iniciar Sesión</title>
</head>

<body class="bg-gray-900 text-white flex justify-center items-center min-h-screen">

  <form action="login.php" method="POST" 
        class="bg-gray-800 p-8 rounded-xl shadow-xl w-96">

    <h2 class="text-3xl font-bold mb-6 text-center">Iniciar Sesión</h2>

    <input name="correo" type="email" required placeholder="Correo"
      class="w-full mb-4 px-4 py-2 rounded bg-gray-700 border border-gray-600">

    <input name="password" type="password" required placeholder="Contraseña"
      class="w-full mb-6 px-4 py-2 rounded bg-gray-700 border border-gray-600">

    <button class="bg-blue-500 w-full py-2 rounded-xl hover:bg-blue-600 transition">
      Entrar
    </button>

    <p class="text-center mt-4 text-gray-400">
      ¿No tienes cuenta? <a href="registro.html" class="text-green-500">Regístrate</a>
    </p>

  </form>

</body>
</html>
