<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pagar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<button onclick="window.location.href='index.php'"
            class="bg-green-500 text-white rounded-xl px-6 py-3 text-lg font-semibold hover:bg-green-600 transition">
            Volver
            </button>

<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">

  <div class="bg-gray-800 p-8 rounded-xl shadow-xl w-96 text-center">

    <h1 id="nombre" class="text-3xl font-bold mb-4"></h1>

    <img id="img" src="" class="rounded-xl mb-4 shadow">

    <p id="precio" class="text-xl mb-4"></p>

    <button class="bg-green-500 px-6 py-3 rounded-xl text-lg hover:bg-green-600">
        Confirmar compra
    </button>

  </div>

  <script>
    // Leer los datos enviados
    const params = new URLSearchParams(window.location.search);

    document.getElementById("nombre").textContent = params.get("nombre");
    document.getElementById("precio").textContent = "Precio: $" + params.get("precio");
    document.getElementById("img").src = params.get("img");
  </script>

</body>
</html>
